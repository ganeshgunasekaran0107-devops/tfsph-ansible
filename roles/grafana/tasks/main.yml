---
- name: Install Grafana repository
  ansible.builtin.template:
    src: grafana.repo.j2
    dest: /etc/yum.repos.d/grafana.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Grafana
  ansible.builtin.dnf:
    name: "{{ grafana_package }}"
    state: present

- name: Ensure Grafana is enabled and running
  ansible.builtin.systemd:
    name: "{{ grafana_service }}"
    enabled: true
    state: started

- name: Ensure Grafana datasource provisioning directory exists
  ansible.builtin.file:
    path: /etc/grafana/provisioning/datasources
    state: directory
    owner: root
    group: grafana
    mode: "0755"

- name: Provision Prometheus datasource
  ansible.builtin.template:
    src: provisioning/datasources/prometheus.yml.j2
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Ensure Grafana dashboard provisioning directory exists
  ansible.builtin.file:
    path: /etc/grafana/provisioning/dashboards
    state: directory
    owner: root
    group: grafana
    mode: "0755"

- name: Ensure Grafana dashboard directory exists
  ansible.builtin.file:
    path: /var/lib/grafana/dashboards
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"

- name: Configure Grafana dashboard provider
  ansible.builtin.template:
    src: provisioning/dashboards/dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/tfsph.yml
    owner: root
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Deploy TFSPH infrastructure dashboard
  ansible.builtin.copy:
    src: dashboards/tfsph-infrastructure.json
    dest: /var/lib/grafana/dashboards/tfsph-infrastructure.json
    owner: grafana
    group: grafana
    mode: "0644"
  notify: Restart grafana