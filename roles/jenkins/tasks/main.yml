---
- name: Install Jenkins prerequisites and CI packages
  ansible.builtin.dnf:
    name: "{{ jenkins_base_packages + [jenkins_java_package] }}"
    state: present

- name: Configure Jenkins LTS repository
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Jenkins
  ansible.builtin.dnf:
    name: jenkins
    state: present

# -------------------------
# Trivy Installation
# -------------------------

- name: Download Trivy RPM
  ansible.builtin.get_url:
    url: "https://github.com/aquasecurity/trivy/releases/download/v{{ trivy_version }}/trivy_{{ trivy_version }}_Linux-64bit.rpm"
    dest: "/tmp/trivy-{{ trivy_version }}.rpm"
    mode: "0644"

- name: Install Trivy
  ansible.builtin.dnf:
    name: "/tmp/trivy-{{ trivy_version }}.rpm"
    state: present
    disable_gpg_check: true

- name: Verify Trivy installation
  ansible.builtin.command: trivy --version
  register: trivy_version_output
  changed_when: false

- name: Display Trivy version
  ansible.builtin.debug:
    msg: "{{ trivy_version_output.stdout }}"

- name: Add Jenkins user to Docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify:
    - Restart Jenkins

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure Jenkins is enabled and running
  ansible.builtin.systemd:
    name: jenkins
    state: started
    enabled: true