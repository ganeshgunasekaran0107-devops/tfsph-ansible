---
- name: Install Jenkins prerequisites and CI packages
  ansible.builtin.dnf:
    name: "{{ jenkins_base_packages + [jenkins_java_package] }}"
    state: present

- name: Configure Jenkins LTS repository
  ansible.builtin.get_url:
    url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
    dest: /etc/yum.repos.d/jenkins.repo
    owner: root
    group: root
    mode: "0644"

- name: Install Jenkins
  ansible.builtin.dnf:
    name: jenkins
    state: present

# -------------------------
# Trivy Installation
# -------------------------

- name: Configure Trivy repository
  ansible.builtin.copy:
    dest: /etc/yum.repos.d/trivy.repo
    mode: "0644"
    content: |
      [trivy]
      name=Trivy repository
      baseurl=https://aquasecurity.github.io/trivy-repo/rpm/releases/$basearch/
      enabled=1
      gpgcheck=1
      gpgkey=https://aquasecurity.github.io/trivy-repo/rpm/public.key

- name: Install Trivy
  ansible.builtin.dnf:
    name: trivy
    state: present
    update_cache: true

- name: Verify Trivy installation
  ansible.builtin.command: trivy --version
  register: trivy_version
  changed_when: false

- name: Display Trivy version
  ansible.builtin.debug:
    var: trivy_version.stdout

- name: Add Jenkins user to Docker group
  ansible.builtin.user:
    name: jenkins
    groups: docker
    append: true
  notify:
    - Restart Jenkins

- name: Ensure Docker is enabled and running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure Jenkins is enabled and running
  ansible.builtin.systemd:
    name: jenkins
    state: started
    enabled: true